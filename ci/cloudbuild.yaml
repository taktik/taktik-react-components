steps:
    -   id: 'fetch-checkout'
        name: 'gcr.io/cloud-builders/git'
        entrypoint: 'bash'
        args: [ '-c', 'git fetch --unshallow --tags && git checkout $BRANCH_NAME' ]

    -   id: 'git-version'
        name: 'taktik/git-version:2.0.23-g54f3ef7b6e'
        args: [ '-f', 'git.version' ]

    # Gates the publish: whatever reaches the registry is what other projects install, so a red
    # commit must not get that far. Every step installs for itself: /workspace is shared, so the
    # repeat is a no-op, and a step still stands up on its own when the ones before it are skipped.
    -   id: 'verify'
        name: 'node:22'
        entrypoint: 'bash'
        env: [ 'HUSKY=0' ] # husky "prepare" hook is useless in CI
        args:
            - '-c'
            - |
                set -euo pipefail
                yarn install --frozen-lockfile
                yarn typecheck
                yarn lint
                yarn test

    -   id: 'build'
        waitFor: [ 'verify' ]
        name: 'node:22'
        entrypoint: 'bash'
        env: [ 'HUSKY=0' ]
        args:
            - '-c'
            - |
                set -euo pipefail
                echo "Building @taktik/taktik-react-components@$$(cat git.version)"
                yarn install --frozen-lockfile
                yarn build
                npm version "$$(cat git.version)" --no-git-tag-version

    # The one check that cannot be done from inside src: every bundled dependency is also a
    # devDependency here, so a declaration file naming react-data-grid or date-fns resolves locally
    # and fails only in a consumer. This packs dist/ and typechecks a probe against it, with nothing
    # installed but the peers.
    -   id: 'verify-consumer'
        waitFor: [ 'build' ]
        name: 'node:22'
        entrypoint: 'bash'
        env: [ 'HUSKY=0' ]
        args: [ '-c', 'set -euo pipefail && yarn verify:consumer' ]

    -   id: 'publish'
        waitFor: [ 'verify-consumer' ]
        name: 'node:22'
        entrypoint: 'bash'
        env: [ 'HUSKY=0' ]
        secretEnv: [ 'REPO_USERNAME', 'REPO_PASSWORD' ]
        args:
            - '-c'
            - |
                set -euo pipefail
                # main -> "latest" ; any other branch -> a dist-tag named after the branch, so it never overrides "latest"
                if [ "$BRANCH_NAME" = "main" ]; then TAG="latest"; else TAG="$$(echo "$BRANCH_NAME" | tr -c 'a-zA-Z0-9-\n' '-')"; fi
                # Nexus accepts basic auth as base64(user:password) on the registry URI.
                # Only the auth line is set: the registry itself comes from publishConfig in package.json,
                # so `yarn install` above keeps resolving public deps from npmjs.
                AUTH="$$(printf '%s:%s' "$$REPO_USERNAME" "$$REPO_PASSWORD" | base64 | tr -d '\n')"
                echo "//npm.taktik.be/repository/npm/:_auth=$${AUTH}" > ~/.npmrc
                npm publish --tag "$$TAG"
                echo "Published @taktik/taktik-react-components@$$(cat git.version) (dist-tag: $$TAG)"

availableSecrets:
    secretManager:
        -   versionName: projects/taktik-dev/secrets/ci-repo-username/versions/1
            env: 'REPO_USERNAME'
        -   versionName: projects/taktik-dev/secrets/ci-repo-password/versions/1
            env: 'REPO_PASSWORD'

options:
    machineType: 'E2_HIGHCPU_8'
timeout: 900s
